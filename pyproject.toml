[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-persistent-rbt"
version = "1.0.0"
description = "Fully persistent Red-Black Tree with path copying"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "persistent", "red-black-tree", "immutable", "data-structures"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-persistent-rbt"
Repository = "https://github.com/ElNeMeR70/py-persistent-rbt"
